[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edgecardio-lora"
version = "0.1.0"
description = "Edge AI ECG Classification with LoRA and INT8 Quantization"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Diego de Pablos" }
]
keywords = [
    "ecg",
    "edge-ai",
    "lora",
    "peft",
    "quantization",
    "int8",
    "onnxruntime",
    "mlops",
    "arrhythmia-detection",
    "federated-learning"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps."
]

# Dependencias BASE (Exclusivas para el contenedor de Producción / Edge)
dependencies = [
    "onnxruntime>=1.17.1",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.4",
    "numpy>=1.26.4",
    "scipy>=1.12.0"
]

[project.optional-dependencies]
# Dependencias de Machine Learning (Fases A-D de entrenamiento y MLOps)
ml = [
    "wfdb>=4.1.2",
    "scikit-learn>=1.4.1",
    "torch>=2.2.1",
    "peft>=0.10.0",
    "onnx>=1.15.0",
    "mlflow>=2.11.1",
    "dvc>=3.48.4",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.0"
]
# Dependencias de Desarrollo (Linters, testing, notebooks)
dev = [
    "pytest>=8.1.1",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.4",
    "mypy>=1.9.0",
    "httpx>=0.27.0",
    "jupyter>=1.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N"    # pep8-naming
]
ignore = [
    "E501", # line length (handled by formatter)
    "N806"  # variable in function should be lowercase (standard X matrix in ML)
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "-ra -q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]
