name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install development dependencies
        run: uv pip install --system ".[dev]"

      - name: Lint and Format with Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Run Unit Tests
        run: |
          pytest tests/ -v

